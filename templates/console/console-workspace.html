<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!--
  ============================================================================
  界面模板 · 工作台双栏（左历史 / 右工作区）
  ============================================================================
  适合：终端用户要「管一批任务」——一次提交好几个、盯着谁跑完谁失败、来回对比。
        老手常用、任务多、需要一眼看到全局时选这个。
  不适合：偶尔跑一次的人（会被左边的列表和右侧的信息量压住）→ 用 console-wizard.html

  换服务时只改下面 <script> 顶部的 CONF 块，布局代码不用动。

  ⚠️ 下面 CONF 里那份默认值**是一份示例配置**（字段名如 current_item / ok_count
     都是它的，不是模板要求的）。它是**能跑的举例**，不是标准 ——
     照抄前先看你自己的后端返回什么，别为了迁就模板去改后端。
  ============================================================================
-->
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f0f2f5; --card:#fff; --ink:#1f2329; --muted:#8a919c; --line:#e5e8ec;
    --brand:#1677ff; --brand-soft:#e8f1ff; --ok:#00a870; --okbg:#e8f8f2;
    --err:#d54941; --errbg:#fdecea; --warn:#d9822b; --warnbg:#fff7e8;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}

  .sider{width:308px;flex:0 0 308px;background:var(--card);
    border-right:1px solid var(--line);display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .brand{padding:22px 22px 18px;border-bottom:1px solid var(--line)}
  .brand b{font-size:16px;letter-spacing:-.01em}
  .brand p{margin:5px 0 0;color:var(--muted);font-size:12.5px}
  .newbtn{margin:18px 18px 6px;padding:11px;border:0;border-radius:9px;background:var(--brand);
    color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .newbtn:hover{opacity:.9}
  .listhint{padding:16px 22px 8px;color:var(--muted);font-size:12px;letter-spacing:.04em}
  .list{flex:1;overflow:auto;padding:0 10px 20px}
  .item{padding:11px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px}
  .item:hover{background:#f5f7fa}
  .item.on{background:var(--brand-soft)}
  .item .r1{display:flex;align-items:center;gap:8px;font-size:13.5px}
  .item .r2{color:var(--muted);font-size:12px;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{margin-left:auto;font-size:11.5px;padding:1px 7px;border-radius:20px;
    background:#f0f2f5;color:#5b6470;flex:0 0 auto}
  .pill.run{background:var(--brand-soft);color:var(--brand)}
  .pill.ok{background:var(--okbg);color:var(--ok)}
  .pill.bad{background:var(--errbg);color:var(--err)}
  .pill.warn{background:var(--warnbg);color:var(--warn)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{padding:18px 34px;border-bottom:1px solid var(--line);background:#fff;
    display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
  .topbar h2{margin:0;font-size:16px;font-weight:600}
  .topbar .sp{flex:1}
  .topbar .meta{color:var(--muted);font-size:12.5px}
  .body{padding:28px 34px 60px;max-width:1180px;width:100%}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:26px 30px;margin-bottom:20px}
  .panel h3{margin:0 0 6px;font-size:15px;font-weight:600}
  .panel .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .row{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start;
    margin-bottom:16px}
  .row > label{color:#4e5969;font-size:13.5px;padding-top:11px}
  .inp{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;
    font:inherit;font-size:14px;background:#fff}
  .inp:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,119,255,.1)}
  .tip{color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.75}
  .tip code{font-family:ui-monospace,Consolas,monospace;background:#f5f7fa;
    padding:1px 5px;border-radius:4px;font-size:12px;word-break:break-all}
  .go{padding:11px 26px;border:0;border-radius:9px;background:var(--brand);color:#fff;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .go:disabled{opacity:.45}
  .go.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}

  .empty{color:var(--muted);text-align:center;padding:90px 20px;font-size:14px}
  .bar{height:9px;border-radius:99px;background:#eef0f4;overflow:hidden;margin:16px 0 12px}
  .bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .5s}
  .bar.ok i{background:var(--ok)}
  .bar.bad i{background:var(--err)}
  .bar.warn i{background:var(--warn)}
  .now{font-size:14.5px;font-weight:600}
  .cnt{display:flex;gap:30px;color:var(--muted);font-size:13px;margin-top:12px;flex-wrap:wrap}
  .cnt b{color:var(--ink);font-size:17px;font-weight:600;margin-right:4px}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:10px 16px;font-size:13.5px;
    margin-bottom:22px}
  .kv .k{color:var(--muted)}
  .kv .v{word-break:break-all}
  .msg{border-radius:9px;padding:13px 16px;font-size:13.5px;margin:18px 0 0}
  .msg.ok{background:var(--okbg);color:#0b6b4a}
  .msg.warn{background:var(--warnbg);color:#8a5a00}
  .msg.bad{background:var(--errbg);color:var(--err)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;
    padding:0 12px 10px 0;border-bottom:1px solid var(--line)}
  td{padding:11px 12px 11px 0;border-bottom:1px solid #f2f4f7;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;
    color:#4e5969;word-break:break-all}
  a.dl{color:var(--brand);text-decoration:none;white-space:nowrap}
  a.dl:hover{text-decoration:underline}
  .log{background:#1c2430;border-radius:9px;padding:16px 18px;margin-top:6px;
    font:12.5px/1.85 ui-monospace,Consolas,monospace;color:#c2cedb;
    max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <aside class="sider">
    <div class="brand"><b id="brandTitle">—</b><p id="brandSub"></p></div>
    <button class="newbtn" id="newBtn">+ 新建任务</button>
    <div class="listhint" id="listHint">历史任务</div>
    <div class="list" id="list"><div class="item"><div class="r2">加载中…</div></div></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 id="title">新建任务</h2>
      <span class="sp"></span>
      <span class="meta" id="refreshed"></span>
    </div>
    <div class="body" id="body">
      <div class="empty">从左边选一个历史任务，或者点「新建任务」开始一次新的任务。</div>
    </div>
  </main>
</div>

<script>
/* ============================================================================
   ★ 配置区：换服务时只改这一块。下面的布局代码一行都不用动。
   ============================================================================ */
const CONF = {
  title: '示例分析服务',
  tagline: '提交任务 · 实时进度 · 结果下载',
  listHint: '历史任务',

  /* 表单：一个主输入。多个输入的服务见 playbook 02 的「多输入」一节 */
  form: {
    heading: '要分析的数据目录',
    desc: '填一个市自己的目录（分析这一个市），或者填它们上一级的目录（一次分析多个市）。',
    label: '数据目录',
    placeholder: '共享盘上的目录',
    tip: '目录里要有 <code>表A_数据文件一.xlsx</code> 和 ' +
         '<code>表B_数据文件二.xlsx</code>；结果会自动存到共享盘。',
    prefill: m => (m.defaults && m.defaults.input_path) || '',
    body: v => ({input_path: v})
  },

  /* 接口路径：按目标服务的实际路径改 */
  api: {
    meta:     '/api/meta',
    create:   '/api/tasks',                          // POST
    list:     '/api/tasks',                          // GET
    task:     id => '/api/tasks/' + id,
    log:      (id, n) => '/api/tasks/' + id + '/log?tail=' + n,
    download: id => '/api/tasks/' + id + '/download',
    file:     (id, rel) => '/api/tasks/' + id + '/download/file?rel=' + encodeURIComponent(rel)
  },

  /* 状态映射：[给人看的词, 色调]。色调只认这五个：run/ok/warn/bad/wait */
  states: {
    queued:         ['排队中', 'wait'],
    running:        ['分析中', 'run'],
    done:           ['已完成', 'ok'],
    partial_failed: ['部分完成', 'warn'],
    failed:         ['失败', 'bad'],
    invalid:        ['无效任务', 'bad'],
    cancelled:      ['已停止', 'wait'],
    interrupted:    ['已中断', 'bad']
  },
  terminal: ['done', 'partial_failed', 'failed', 'invalid', 'cancelled', 'interrupted'],

  /* 从任务对象里取字段。换服务时改这几个取值函数 */
  read: {
    id:        t => t.id,
    /* 列表里显示的一行摘要 */
    summary:   t => t.input_path,
    outputDir: t => t.output_dir || '',
    progress:  t => (t.state === 'invalid' ? 0 : Math.round(t.progress || 0)),
    /* 一行「现在在干什么」 */
    now:       t => t.state === 'queued'
                     ? ''
                     : (t.current_item
                         ? '正在处理 ' + t.current_item +
                           (t.total_count ? '（' + (t.current_no||0) + '/' + t.total_count + '）' : '')
                         : ''),
    /* 计数：[标签, 数值][] */
    counts:    t => [['已完成', t.ok_count], ['跳过', t.skipped_count], ['失败', t.fail_count]],
    error:     t => t.error || '',
    artifacts: t => (t.artifacts || []).map(a => ({
                   label: a.label || '', path: a.rel_path || a.path || '', size: a.size
                 })),
    /* 产物下载地址 */
    fileUrl:   (id, a) => CONF.api.file(id, a.path)
  },

  /* 各状态的提示语 */
  msg: {
    partial: '部分完成：有区域被跳过或失败，结果不完整。',
    done:    '任务完成。'
  },

  /* 轮询间隔（毫秒） */
  pollMs: 4000
};
/* ======================= 配置区结束，以下不用改 ============================ */

const $ = id => document.getElementById(id);
const ST = CONF.states;
const TERMINAL = CONF.terminal;
let cur = null, stopWatch = null;

async function api(p, o){
  const r = await fetch(p, o); const txt = await r.text();
  let d; try { d = JSON.parse(txt); } catch(e) { d = txt; }
  if (!r.ok) throw new Error((d && d.detail) ? d.detail : (txt || r.status));
  return d;
}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stText = s => (ST[s] ? ST[s][0] : s);
const stTone = s => (ST[s] ? ST[s][1] : 'wait');
const short = p => { if(!p) return '—';
  const a = String(p).split(/[\\/]/).filter(Boolean);
  return a.length<=1 ? p : '…/' + a[a.length-1]; };
const fmtSize = n => { n = Number(n)||0;
  if (n<1024) return n+' B';
  if (n<1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB'; };

document.title = CONF.title;
$('brandTitle').textContent = CONF.title;
$('brandSub').textContent = CONF.tagline;
$('listHint').textContent = CONF.listHint;

async function loadList(){
  try {
    const d = await api(CONF.api.list + '?limit=50');
    const rows = d.tasks || [];
    $('list').innerHTML = rows.length ? rows.map(t =>
      '<div class="item' + (CONF.read.id(t)===cur?' on':'') + '" data-id="' + esc(CONF.read.id(t)) + '">' +
        '<div class="r1">' + esc(short(CONF.read.summary(t))) +
          '<span class="pill ' + stTone(t.state) + '">' + stText(t.state) + '</span></div>' +
        '<div class="r2">' + esc(String(t.created_at||'').replace('T',' ').slice(0,16)) +
          '　' + CONF.read.progress(t) + '%</div></div>').join('')
      : '<div class="item"><div class="r2">还没有任务</div></div>';
    $('list').querySelectorAll('.item[data-id]').forEach(el =>
      el.onclick = () => open(el.getAttribute('data-id')));
    $('refreshed').textContent = '刷新于 ' + new Date().toLocaleTimeString();
  } catch(e){ $('list').innerHTML = '<div class="item"><div class="r2">读取失败</div></div>'; }
}

/* ────────────────────────────────────────────────────────────────────────────
   进度机制：轮询（默认）。换 SSE / 日志 tail 见 templates/adapters/ ——
   整个替换下面这一个函数即可，其余代码一行不用动。
   ──────────────────────────────────────────────────────────────────────────── */
function startWatching(taskId, onUpdate){
  let stopped = false;
  const tick = async () => {
    if (stopped) return;
    try { onUpdate(await api(CONF.api.task(taskId))); } catch(e){ /* 单次失败不打断 */ }
  };
  tick();
  const t = setInterval(tick, CONF.pollMs);
  return () => { stopped = true; clearInterval(t); };
}

function newTask(){
  cur = null;
  if (stopWatch){ stopWatch(); stopWatch = null; }
  $('title').textContent = '新建任务';
  $('body').innerHTML =
    '<div class="panel"><h3>' + esc(CONF.form.heading) + '</h3>' +
    '<p class="sub">' + esc(CONF.form.desc) + '</p>' +
      '<div class="row"><label for="root">' + esc(CONF.form.label) + '</label><div>' +
        '<input class="inp" id="root" placeholder="' + esc(CONF.form.placeholder) + '">' +
        '<div class="tip">' + CONF.form.tip + '</div>' +
      '</div></div>' +
      '<div class="acts"><button class="go" id="submit">开始</button>' +
      '<span class="tip" id="fb" style="margin:0;align-self:center"></span></div></div>';
  $('submit').onclick = submit;
  api(CONF.api.meta).then(m => {
    const v = CONF.form.prefill(m);
    if (v) $('root').value = v;
  }).catch(()=>{});
  loadList();
}

async function submit(){
  const v = $('root').value.trim();
  if (!v){ $('fb').textContent = '请先填' + CONF.form.label + '。'; return; }
  $('submit').disabled = true; $('fb').textContent = '提交中…';
  try {
    const r = await api(CONF.api.create, {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(CONF.form.body(v))});
    $('fb').textContent = '';
    cur = r.task_id;
    open(r.task_id);
  } catch(e){ $('fb').textContent = '提交失败：' + e.message; $('submit').disabled = false; }
}

function open(id){
  cur = id;
  $('title').textContent = '任务详情';
  loadList();
  if (stopWatch){ stopWatch(); stopWatch = null; }
  stopWatch = startWatching(id, t => { render(t).catch(() => {}); loadList(); });
}

/* 手动刷新一次（停止 / 重跑之后用） */
async function refresh(){
  if (!cur) return;
  try { await render(await api(CONF.api.task(cur))); } catch(e){}
}

async function render(t){
  if (!cur || !t) return;
  const p = CONF.read.progress(t);
  const tone = stTone(t.state);
  const barTone = tone==='run' ? '' : tone;
  const arts = CONF.read.artifacts(t);
  const total = arts.reduce((s,a) => s + (Number(a.size)||0), 0);
  const counts = CONF.read.counts(t).map(c =>
    '<span><b>' + (c[1]||0) + '</b>' + esc(c[0]) + '</span>').join('');
  const log = await fetch(CONF.api.log(cur, 40)).then(r => r.text()).catch(() => '');
  const running = t.state === 'queued' || t.state === 'running';
  const done = TERMINAL.indexOf(t.state) >= 0;

  $('body').innerHTML =
    '<div class="panel">' +
      '<div class="kv">' +
        '<div class="k">' + esc(CONF.form.label) + '</div><div class="v">' +
          esc(CONF.read.summary(t)) + '</div>' +
        '<div class="k">结果目录</div><div class="v">' +
          esc(CONF.read.outputDir(t) || '—') + '</div>' +
        '<div class="k">提交时间</div><div class="v">' +
          esc(String(t.created_at||'').replace('T',' ')) + '</div>' +
      '</div>' +
      '<div class="now">' + esc(t.state==='queued'
        ? (stText(t.state) + (t.queue_position>1 ? '（前面还有 ' + (t.queue_position-1) + ' 个）' : ''))
        : (CONF.read.now(t) || stText(t.state))) + '</div>' +
      '<div class="bar ' + barTone + '"><i style="width:' + p + '%"></i></div>' +
      '<div class="cnt">' + counts +
        '<span style="margin-left:auto"><b>' + p + '</b>%</span></div>' +
      (CONF.read.error(t)
        ? '<div class="msg ' + (t.state==='partial_failed' ? 'warn' : (done ? 'bad' : 'ok')) + '">' +
          esc(CONF.read.error(t)) + '</div>'
        : (t.state === 'done' ? '<div class="msg ok">' + esc(CONF.msg.done) + '</div>' : '')) +
      '<div class="acts">' +
        (running ? '<button class="go ghost" id="stop">停止任务</button>' : '') +
        (done ? '<button class="go" id="retry">重跑（覆盖）</button>' +
                '<button class="go ghost" id="retryNew">重跑（另存一份）</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="panel"><h3>结果文件' +
      (arts.length ? '（' + arts.length + ' 个，共 ' + fmtSize(total) + '）' : '') + '</h3>' +
      (arts.length
        ? '<div class="acts" style="margin:0 0 14px"><a class="dl" href="' +
            esc(CONF.api.download(cur)) + '">打包下载全部</a></div>' +
          '<table><thead><tr><th style="width:110px">类型</th><th>路径</th>' +
          '<th style="width:90px">大小</th><th style="width:70px"></th></tr></thead><tbody>' +
          arts.map(a => '<tr><td>' + esc(a.label||'—') + '</td>' +
            '<td><code>' + esc(a.path) + '</code></td>' +
            '<td>' + fmtSize(a.size) + '</td>' +
            '<td><a class="dl" href="' + esc(CONF.read.fileUrl(cur, a)) + '">下载</a></td></tr>').join('') +
          '</tbody></table>'
        : '<div class="tip">暂无结果文件' + (running ? '，跑完后会出现在这里。' : '。') + '</div>') +
    '</div>' +
    '<div class="panel"><h3>运行输出</h3>' +
      '<div class="log">' + esc(log || '（暂无输出）') + '</div></div>';

  const s = $('stop'), r1 = $('retry'), r2 = $('retryNew');
  if (s) s.onclick = async () => {
    if(!confirm('确认停止？未开始的部分立即取消，正在进行的那一个要等它跑完。')) return;
    try { await api(CONF.api.task(cur) + '/stop', {method:'POST'}); refresh(); } catch(e){ alert(e.message); }
  };
  if (r1) r1.onclick = () => doRetry(false);
  if (r2) r2.onclick = () => doRetry(true);
  const lg = $('body').querySelector('.log');
  if (lg) lg.scrollTop = lg.scrollHeight;
}

async function doRetry(newDir){
  if (!confirm(newDir
      ? '重跑会新开一个结果目录，保留这次的结果供对比。\n\n注意：重跑是从零完整重算，不会更快。'
      : '重跑会覆盖同一个结果目录里的已有成果。\n\n注意：重跑是从零完整重算，不会更快。')) return;
  try { await api(CONF.api.task(cur) + '/retry?new_dir=' + newDir, {method:'POST'}); refresh(); }
  catch(e){ alert('重跑失败：' + e.message); }
}

$('newBtn').onclick = newTask;
newTask();
setInterval(() => { if (!cur) loadList(); }, CONF.pollMs + 2000);
</script>
</body>
</html>
