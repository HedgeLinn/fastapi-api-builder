<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示例分析</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f7f9fc; --card:#fff; --ink:#1a2430; --muted:#77828f; --line:#e6eaf0;
    --accent:#2f6fed; --accent-soft:#eef4ff; --ok:#12a06a; --oksoft:#e9f8f1;
    --err:#cf4438; --errsoft:#fdeeed; --warn:#b3730a; --warnsoft:#fff6e6;
  }
  body{margin:0;background:var(--bg);color:var(--ink);
    font:17px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:56px 24px 100px}

  /* 步骤条 */
  .steps{display:flex;align-items:center;margin-bottom:36px;padding:0 4px}
  .st{display:flex;align-items:center;gap:9px;color:#aab2bd;font-size:14px;
    font-weight:500;white-space:nowrap}
  .st .n{width:28px;height:28px;border-radius:50%;border:2px solid #d9dfe7;
    display:flex;align-items:center;justify-content:center;font-size:13.5px;
    font-weight:700;flex:0 0 auto;background:#fff}
  .st.on{color:var(--accent)}
  .st.on .n{background:var(--accent);border-color:var(--accent);color:#fff}
  .st.ok{color:var(--ok)}
  .st.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
  .ln{flex:1;height:2px;background:#e3e8ee;margin:0 12px;border-radius:2px}
  .ln.on{background:var(--ok)}

  .card{background:var(--card);border-radius:18px;padding:40px 44px;
    box-shadow:0 1px 3px rgba(16,24,40,.05), 0 12px 32px -18px rgba(16,24,40,.14)}
  h1{font-size:25px;font-weight:650;letter-spacing:-.018em;margin:0 0 10px}
  .sub{color:var(--muted);font-size:15.5px;margin:0 0 30px;max-width:52ch}
  label{display:block;font-size:15px;font-weight:600;margin:0 0 12px;color:#39434f}
  .inp{width:100%;padding:17px 19px;border:2px solid var(--line);border-radius:13px;
    font:inherit;font-size:16px;background:#fbfcfe}
  .inp:focus{outline:0;border-color:var(--accent);background:#fff}
  .btn{width:100%;padding:18px;border:0;border-radius:13px;background:var(--accent);
    color:#fff;font:inherit;font-size:17px;font-weight:650;cursor:pointer;margin-top:26px}
  .btn:hover{opacity:.93}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);font-weight:500;
    margin-top:12px}
  .note{margin-top:20px;padding:18px 20px;background:var(--accent-soft);border-radius:12px;
    font-size:14.5px;line-height:1.8;color:#33445c}
  .note b{color:var(--ink)}
  .note code{font-family:ui-monospace,Consolas,monospace;background:#fff;padding:2px 7px;
    border-radius:5px;font-size:13px;word-break:break-all}

  .row{display:flex;gap:14px;margin-top:30px}
  .row .btn{margin-top:0}
  .sum{background:#f7f9fc;border-radius:12px;padding:20px 22px;font-size:15px;line-height:2}
  .sum .k{color:var(--muted);display:inline-block;width:96px}
  .sum code{font-family:ui-monospace,Consolas,monospace;font-size:14px;word-break:break-all}

  .bar{height:12px;border-radius:99px;background:#eaedf2;overflow:hidden;margin:22px 0 14px}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#6699f5,#2f6fed);transition:width .5s}
  .now{font-size:16px;font-weight:600}
  .cnt{display:flex;gap:30px;font-size:15px;color:var(--muted);margin-top:16px}
  .cnt b{color:var(--ink);font-size:19px;font-weight:650;margin-right:5px}
  .log{margin-top:26px;background:#1c2430;border-radius:12px;padding:18px 20px;
    font:13px/1.85 ui-monospace,Consolas,monospace;color:#c2cedb;
    max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-all}

  .big{text-align:center;padding:14px 0 8px}
  .big .ico{font-size:52px;line-height:1;color:var(--ok)}
  .big h2{font-size:22px;font-weight:650;margin:18px 0 8px}
  .big p{color:var(--muted);font-size:15.5px;margin:0}
  .pathbox{margin-top:26px;background:var(--oksoft);border-radius:13px;padding:22px 24px;
    text-align:left}
  .pathbox .k{font-size:13.5px;color:#4e7a68;font-weight:600;margin-bottom:8px}
  .pathbox code{font-family:ui-monospace,Consolas,monospace;font-size:14px;
    color:#0e5c42;word-break:break-all;line-height:1.7}
  .files{margin-top:16px;font-size:14.5px;color:var(--muted)}
  .msg{margin-top:22px;border-radius:12px;padding:20px 22px;font-size:15px;line-height:1.75}
  .msg.warn{background:var(--warnsoft);color:var(--warn)}
  .msg.bad{background:var(--errsoft);color:var(--err)}

  .recent{margin-top:34px;font-size:14.5px}
  .recent summary{cursor:pointer;color:var(--muted);font-weight:500;list-style:none;
    text-align:center}
  .recent summary::-webkit-details-marker{display:none}
  .item{display:flex;align-items:center;gap:12px;padding:14px 4px;
    border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px}
  .item:last-child{border-bottom:0}
  .item:hover{background:#fafbfe}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .d1{background:#2f6fed}.d2{background:#12a06a}.d3{background:#cf4438}
  .d4{background:#c3cad3}.d5{background:#d9822b}
  .item .p{margin-left:auto;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">

  <div class="steps" id="steps">
    <div class="st on" data-s="1"><span class="n">1</span>选数据</div>
    <div class="ln" data-l="1"></div>
    <div class="st" data-s="2"><span class="n">2</span>确认</div>
    <div class="ln" data-l="2"></div>
    <div class="st" data-s="3"><span class="n">3</span>分析中</div>
    <div class="ln" data-l="3"></div>
    <div class="st" data-s="4"><span class="n">4</span>取结果</div>
  </div>

  <div class="card" id="card"></div>

  <details class="recent">
    <summary>查看以前的记录</summary>
    <div id="recent" style="margin-top:14px">
      <div class="item" style="color:#77828f">加载中…</div>
    </div>
  </details>

</div>

<script>
const $ = id => document.getElementById(id);
const ST = {queued:'排队中', running:'分析中', done:'已完成', partial_failed:'部分完成',
  failed:'没成功', invalid:'没找到可分析的数据', cancelled:'已停止', interrupted:'被中断'};
const DOT = {queued:'d4', running:'d1', done:'d2', partial_failed:'d5',
  failed:'d3', invalid:'d3', cancelled:'d4', interrupted:'d3'};
const TERMINAL = ['done','partial_failed','failed','invalid','cancelled','interrupted'];
let step = 1, cur = null, timer = null, lastInput = '';

async function api(p, o){
  const r = await fetch(p, o); const txt = await r.text();
  let d; try { d = JSON.parse(txt); } catch(e) { d = txt; }
  if (!r.ok) throw new Error((d && d.detail) ? d.detail : (txt || r.status));
  return d;
}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtSize = n => { n = Number(n)||0;
  if (n<1024) return n+' B';
  if (n<1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB'; };

function setStep(n){
  step = n;
  document.querySelectorAll('.st').forEach(el => {
    const s = Number(el.getAttribute('data-s'));
    el.className = 'st' + (s < n ? ' ok' : (s === n ? ' on' : ''));
  });
  document.querySelectorAll('.ln').forEach(el => {
    el.className = 'ln' + (Number(el.getAttribute('data-l')) < n ? ' on' : '');
  });
}

/* ---------- 第 1 步：选数据 ---------- */
async function step1(prefillTitle){
  setStep(1);
  if (timer){ clearInterval(timer); timer = null; }
  cur = null;
  $('card').innerHTML =
    '<h1>示例分析</h1>' +
    '<p class="sub">选一个数据目录，服务会分析里面的各个区域并生成示例分析结果。</p>' +
    '<label for="root">要分析哪个数据目录？</label>' +
    '<input class="inp" id="root" placeholder="共享盘上的目录路径">' +
    '<div class="note" id="howto"><b>不知道填哪个？</b>把鼠标放这儿看不到——<br>' +
      '· 只分析一个市：填那个市的目录<br>' +
      '· 一次分析多个市：填它们<b>上一级</b>的目录，服务会逐个处理<br>' +
      '两种情况服务都会自动识别，填错它会告诉你原因。</div>' +
    '<button class="btn" id="go">下一步</button>' +
    '<p class="sub" id="fb" style="margin:14px 0 0;text-align:center;font-size:14px"></p>';
  $('go').onclick = () => {
    const v = $('root').value.trim();
    if (!v){ $('fb').textContent = '请先填一个目录。'; return; }
    lastInput = v; step2();
  };
  try {
    const m = await api('/api/meta');
    if (m.defaults && m.defaults.input_path && !$('root').value) {
      $('root').value = m.defaults.input_path;
    }
  } catch(e){}
  loadRecent();
}

/* ---------- 第 2 步：确认 ---------- */
async function step2(){
  setStep(2);
  let outRoot = '';
  try { const m = await api('/api/meta'); outRoot = (m.defaults && m.defaults.output_root) || ''; } catch(e){}
  $('card').innerHTML =
    '<h1>确认一下</h1>' +
    '<p class="sub">确认后就会开始分析。分析过程中可以随时停止。</p>' +
    '<div class="sum">' +
      '<div><span class="k">数据目录</span><code>' + esc(lastInput) + '</code></div>' +
      '<div><span class="k">结果保存到</span><code>' + esc(outRoot || '服务端固定位置') + '</code></div>' +
    '</div>' +
    '<div class="note">分析要跑一会儿：一个市大约 20–30 秒，如果填的是上一级目录、里面有 19 个市，' +
      '总共约 10 分钟。跑的时候可以关掉页面，服务在后台继续跑。</div>' +
    '<div class="row">' +
      '<button class="btn" id="ok">开始分析</button>' +
      '<button class="btn ghost" id="back">返回修改</button>' +
    '</div>' +
    '<p class="sub" id="fb" style="margin:14px 0 0;text-align:center;font-size:14px"></p>';
  $('back').onclick = step1;
  $('ok').onclick = async () => {
    $('ok').disabled = true; $('fb').textContent = '正在提交…';
    try {
      const r = await api('/api/tasks', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({input_path: lastInput})});
      cur = r.task_id;
      step3();
    } catch(e){ $('fb').textContent = '提交失败：' + e.message; $('ok').disabled = false; }
  };
}

/* ---------- 第 3 步：分析中 ---------- */
function step3(){
  setStep(3);
  $('card').innerHTML =
    '<h1>正在分析…</h1>' +
    '<p class="sub">可以关掉这个页面去做别的，服务会在后台继续跑，跑完结果自动存到共享盘。</p>' +
    '<div class="now" id="now">正在启动…</div>' +
    '<div class="bar"><i id="bar"></i></div>' +
    '<div class="cnt">' +
      '<span><b id="nOk">0</b>已完成</span>' +
      '<span><b id="nSkip">0</b>跳过</span>' +
      '<span><b id="nBad">0</b>失败</span>' +
      '<span style="margin-left:auto"><b id="pct">0</b>%</span>' +
    '</div>' +
    '<div class="log" id="log">　</div>' +
    '<button class="btn ghost" id="abort">不等了，去取历史结果</button>';
  $('abort').onclick = step1;
  if (timer) clearInterval(timer);
  timer = setInterval(pollRun, 3000);
  pollRun();
}

async function pollRun(){
  if (!cur) return;
  let t;
  try { t = await api('/api/tasks/' + cur); } catch(e){ return; }
  const p = t.state === 'invalid' ? 0 : Math.round(t.progress||0);
  $('bar').style.width = p + '%';
  $('pct').textContent = p;
  $('nOk').textContent = t.ok_count||0;
  $('nSkip').textContent = t.skipped_count||0;
  $('nBad').textContent = t.fail_count||0;
  $('now').textContent = t.state==='queued'
    ? ('排队中' + (t.queue_position>1 ? '（前面还有 ' + (t.queue_position-1) + ' 个任务）' : ''))
    : (t.current_item ? ('正在处理 ' + t.current_item +
        (t.total_count ? '（第 ' + (t.current_no||0) + ' 个，共 ' + t.total_count + ' 个）' : ''))
       : (t.phase==='scan' ? '正在扫描目录…（刚启动的十几秒没有输出是正常的）'
          : (ST[t.state] || '分析中…')));
  try {
    const lg = await fetch('/api/tasks/' + cur + '/log?tail=25').then(r => r.text());
    $('log').textContent = lg || '　';
    $('log').scrollTop = $('log').scrollHeight;
  } catch(e){}
  if (TERMINAL.indexOf(t.state) >= 0){
    clearInterval(timer); timer = null;
    step4(t);
  }
}

/* ---------- 第 4 步：取结果 ---------- */
function step4(t){
  setStep(4);
  const arts = t.artifacts || [];
  const good = t.state==='done' || t.state==='partial_failed';
  const total = arts.reduce((s,a) => s + (Number(a.size)||0), 0);
  let html = '';
  if (good){
    html = '<div class="big"><div class="ico">✓</div>' +
      '<h2>分析完成</h2><p>结果已经存到共享盘，同事也可以直接去那儿取。</p></div>' +
      '<div class="pathbox"><div class="k">结果目录</div><code>' +
      esc(t.output_dir || '') + '</code>' +
      (arts.length ? '<div class="files">共 ' + arts.length + ' 个文件，' +
        fmtSize(total) + '</div>' : '') + '</div>' +
      (t.state === 'partial_failed'
        ? '<div class="msg warn">注意：有区域被跳过或失败，结果不完整。' +
          esc(t.error || '') + '</div>' : '') +
      '<button class="btn" id="dl">下载到本机</button>' +
      '<button class="btn ghost" id="again">再分析一个</button>';
  } else {
    html = '<div class="big"><div class="ico" style="color:#cf4438">×</div>' +
      '<h2>没能完成</h2><p>这次分析没有产出结果。</p></div>' +
      '<div class="msg bad">' + esc(t.error || (ST[t.state] || t.state)) + '</div>' +
      '<button class="btn" id="again">再试一次</button>';
  }
  $('card').innerHTML = html;
  if ($('dl')) $('dl').onclick = () => { location.href = '/api/tasks/' + cur + '/download'; };
  $('again').onclick = step1;
  loadRecent();
}

/* ---------- 历史记录 ---------- */
async function loadRecent(){
  try {
    const d = await api('/api/tasks?limit=15');
    const box = $('recent');
    box.innerHTML = d.tasks.length ? d.tasks.map(t =>
      '<div class="item" data-id="' + esc(t.id) + '">' +
        '<span class="dot ' + (DOT[t.state]||'d4') + '"></span>' +
        '<span>' + esc(ST[t.state]||t.state) + '</span>' +
        '<span style="color:#77828f;overflow:hidden;text-overflow:ellipsis;' +
          'white-space:nowrap;max-width:330px">' +
          esc(String(t.input_path||'').split(/[\\/]/).filter(Boolean).slice(-1)[0] || '') + '</span>' +
        '<span class="p">' + esc(String(t.created_at||'').replace('T',' ').slice(5,16)) + '</span>' +
      '</div>').join('') : '<div class="item" style="color:#77828f">还没有记录</div>';
    box.querySelectorAll('.item[data-id]').forEach(el =>
      el.onclick = async () => {
        const id = el.getAttribute('data-id');
        try {
          const t = await api('/api/tasks/' + id);
          cur = id;
          if (['queued','running'].indexOf(t.state) >= 0){
            setStep(3);
            $('card').innerHTML =
              '<h1>正在分析…</h1><p class="sub">这个任务还在跑。</p>' +
              '<div class="now" id="now">—</div><div class="bar"><i id="bar"></i></div>' +
              '<div class="cnt"><span><b id="nOk">0</b>已完成</span>' +
              '<span><b id="nSkip">0</b>跳过</span>' +
              '<span><b id="nBad">0</b>失败</span>' +
              '<span style="margin-left:auto"><b id="pct">0</b>%</span></div>' +
              '<div class="log" id="log">　</div>' +
              '<button class="btn ghost" id="abort">返回</button>';
            $('abort').onclick = step1;
            if (timer) clearInterval(timer);
            timer = setInterval(pollRun, 3000); pollRun();
          } else step4(t);
        } catch(e){ alert('读取失败：' + e.message); }
      });
  } catch(e){}
}

step1();
</script>
</body>
</html>
